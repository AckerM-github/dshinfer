[project]
name = "dshinfer"
version = "0.1.0"
description = "DeepSeek-V4-Pro-Qwen3.5-9B 推理服务层（OpenAI 兼容）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "orjson>=3.10",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
dshinfer = "dshinfer.main:run"
dshinfer-tui = "dshinfer.tui:main"

[project.optional-dependencies]
tui = [
    "textual>=0.89",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dshinfer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
