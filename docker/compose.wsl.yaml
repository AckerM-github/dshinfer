# WSL2 主机配置（2026-11-10 起：GPU 通路与云完全同构，不再手工塞驱动）
#
#   一次性准备（docs/docker.md 10.2 / 10.3）：
#     sudo apt install -y docker.io docker-compose-v2
#     sudo apt install -y nvidia-container-toolkit          # NVIDIA 官方源，实测 1.20.2 在 Ubuntu 26.04 可用
#     sudo nvidia-ctk runtime configure --runtime=docker
#     sudo systemctl restart docker
#
#   之后：bash scripts/wsl-deploy.sh        # = git 同步 + build + up + 等 /healthz
#   等价手工：docker compose -f docker/compose.yaml -f docker/compose.wsl.yaml up -d
#
# 这个文件只写「WSL 这台机器和云上那台机器不一样的两件事」：
#   1. 权重目录：WSL 放 ext4 的 /home/linc/models（/mnt/d 是 9p，mmap 慢 5-10 倍）；云上一般 /srv/models
#   2. 上下文默认值：8 GB 显存放 32K（40 t/s、显存 6.0 GB）；云端卡大就删掉这行或改 65536
# GPU 需求写在基础文件 docker/compose.yaml 的 deploy.resources 里（nvidia 运行时），
# 覆盖层不再出现 /dev/dxg、/usr/lib/wsl、LD_LIBRARY_PATH 这类手工通路。
name: dshinfer

services:
  infer:
    volumes:
      - ${MODELS_DIR:-/home/linc/models}:/models:ro

    environment:
      DSHINFER_N_CTX: "32768"
