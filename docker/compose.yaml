# dshinfer —— 单容器部署（服务层 + llama.cpp 引擎同容器）
#
#   docker compose -f docker/compose.yaml build
#   docker compose -f docker/compose.yaml up -d
#   curl http://127.0.0.1:8000/healthz
#
# 前置：Docker Desktop（WSL2 后端）或 Linux + nvidia-container-toolkit，
#       并且下面 GPU 段能被识别：docker run --rm --gpus all ubuntu nvidia-smi
#
# 配置只有一个事实来源：
#   config/base.env    调优参数（与 Windows 原生跑共用，路径与机器无关）
#   config/docker.env  容器内路径
# 想临时改某一项：在下面写 environment:（它对 env_file 有更高优先级）。
name: dshinfer

services:
  infer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # 引擎是进程内的 llama-cpp-python：没有 llama-server 可下，也就没有 build args。
    image: dshinfer:local
    container_name: dshinfer
    restart: unless-stopped
    # 引擎是 uvicorn 的子进程，给足优雅退出时间（uvicorn graceful shutdown 10 s + 引擎 kill）
    stop_grace_period: 30s

    ports:
      # 只监听本机，避免把没鉴权的 OpenAI 兼容接口暴露到局域网；要外部访问改成 "8000:8000"
      - "127.0.0.1:8000:8000"

    volumes:
      # 权重永远不进镜像层：5.24 GB，且实验期会换 Q4_K_M / Q3_K_M。
      # 这里是"宿主机上的哪个目录挂到 /models"，属于机器差异：
      #   WSL    → compose.wsl.yaml 里指定 /home/linc/models（ext4，别用 /mnt/d 的 9p）
      #   云上    → MODELS_DIR=/srv/models
      #   不设时用 /models 占位，权重检查会明确报"目录为空"
      - "${MODELS_DIR:-/models}:/models:ro"
      # 引擎日志（llama-server 的 stdout/stderr 落这里）
      - dshinfer-logs:/var/log/dshinfer

    # 配置来源：调优参数 + 容器路径，两段分开维护
    env_file:
      - ../config/base.env
      - ../config/docker.env

    # —— GPU ——
    # compose v2 会识别 deploy.resources.reservations.devices（不需要 swarm）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Compose >= 2.30 也可以直接写一行：gpus: all

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

volumes:
  dshinfer-logs:

# 想看模型是否真的吃满显存：docker exec dshinfer nvidia-smi
# 想核对容器内生效的配置契约：docker exec dshinfer python - /models 见 GET /admin/config
# 想直连引擎做对照压测：compose 里再暴露引擎端口（默认只在容器内 127.0.0.1:8124），
# 加一行 "127.0.0.1:8124:8124" 即可。
